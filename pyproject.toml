[project]
name = "debussy"
version = "0.6.0"
description = "AI-assisted curation workbench for GLAM collection data"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Johannes", email = "dcb@unibe.ch"},
]
keywords = ["GLAM", "metadata", "curation", "digital-humanities", "AI"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "pandas>=2.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.100", "uvicorn[standard]>=0.20", "python-multipart>=0.0.6"]
ai = ["httpx>=0.24"]
images = ["Pillow>=10.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1"]
# FIX: was "kuratierwerkbank[api,ai,dev]" (wrong package name)
all = ["debussy[api,ai,images,dev]"]

[project.scripts]
kwb = "kwb.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E701/E702: Compact single-line style used intentionally in several modules.
# E402: Module-level imports after try/except blocks (FastAPI optional deps pattern).
# E722: Bare except used intentionally in network-resilience code.
# F841: Unused variables in some legacy routes.
# F811: Duplicate function defs in csv_loader.py / workspace.py (stub + full implementation pattern).
ignore = ["E701", "E702", "E402", "E722", "F841", "F811"]

[tool.pytest.ini_options]
testpaths = ["tests"]
