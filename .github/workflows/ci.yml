name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Ruff Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check src/ tests/

  test-pytest:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    env:
      KWB_GPUSTACK_URL: ""
      KWB_GPUSTACK_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,ai,dev]"

      - name: Run pytest
        run: |
          pytest -q

  smoke:
    name: Smoke Test (start app + check /)
    runs-on: ubuntu-latest

    env:
      KWB_GPUSTACK_URL: ""
      KWB_GPUSTACK_KEY: ""
      KWB_HOST: "127.0.0.1"
      KWB_PORT: "8765"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,ai,dev]"

      - name: Start app in background
        run: |
          nohup python -m kwb.api.app > smoke.log 2>&1 &
          echo $! > smoke.pid

      - name: Wait for app to become ready
        run: |
          python - <<'PY'
          import time
          import urllib.request
          import sys

          url = "http://127.0.0.1:8765/"
          deadline = time.time() + 30

          while time.time() < deadline:
              try:
                  with urllib.request.urlopen(url, timeout=5) as resp:
                      status = resp.getcode()
                      body = resp.read().decode("utf-8", errors="ignore")
                      if status == 200 and "Debussy" in body:
                          print("Smoke test passed: app responded with 200 and body contains 'Debussy'")
                          sys.exit(0)
              except Exception:
                  time.sleep(1)

          print("Smoke test failed: app did not become ready in time")
          sys.exit(1)
          PY

      - name: Show app log on failure
        if: failure()
        run: |
          echo "===== smoke.log ====="
          cat smoke.log || true

      - name: Stop app
        if: always()
        run: |
          kill "$(cat smoke.pid)" || true

  catalog-consistency:
    name: Testkatalog Konsistenz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,ai,dev]"

      - name: Check docs/FUNKTIONSKATALOG.md test statistics
        run: python scripts/update_test_catalog.py --check-doc