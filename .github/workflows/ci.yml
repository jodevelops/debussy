name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Ruff Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install ruff
        run: pip install "ruff>=0.1"
      - name: Ruff check
        run: ruff check src/ tests/

  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,ai,dev]"
      - name: Run tests
        run: |
          PYTHONPATH=src python -m unittest discover tests -v
        env:
          KWB_GPUSTACK_URL: ""
          KWB_GPUSTACK_KEY: ""

  catalog-consistency:
    name: Testkatalog Konsistenz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,ai,dev]"
      - name: Check docs/FUNKTIONSKATALOG.md test statistics
        run: python scripts/update_test_catalog.py --check-doc
