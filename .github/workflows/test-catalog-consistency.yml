name: Testkatalog Konsistenz

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  check-test-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,ai,dev]"
      - name: Check docs/FUNKTIONSKATALOG.md test statistics
        run: |
          python scripts/update_test_catalog.py --check-doc
